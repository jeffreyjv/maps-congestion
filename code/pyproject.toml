[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "geohash2>=1.1",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.0",
    "httpx>=0.27",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-m 'not load'"
markers = [
    "load: run manually with: uv run pytest -m load -v -s",
]
